[project]
name = "evalutate"
version = "0.1.0"
description = "E-License document classification + OCR evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]",
    "pymupdf",
    "pillow",
    "requests",
    "python-dotenv",
    "httpx",
    "aiohttp",
]

[project.scripts]
eval-index = "eval.index:main"
eval-worker = "eval.worker:main"
eval-server = "eval.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]
